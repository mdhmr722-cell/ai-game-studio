<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI GAME STUDIO — OMAR AI</title>
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#080a12" />
  <meta name="description" content="AI GAME STUDIO — منصة مجانية بالكامل لصناعة الألعاب والتطبيقات بالذكاء الاصطناعي. Developed by OMAR NAJMI, powered by OMAR AI." />
  <link rel="stylesheet" href="styles/app.css" />
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="application-name" content="AI GAME STUDIO" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AI GAME" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <main class="main">
      <header class="topbar" id="topbar"></header>
      <div class="view" id="view">
        <div class="boot">
          <div class="boot-orb"></div>
          <p>AI GAME STUDIO</p>
          <small>Loading / جارٍ التحميل…</small>
        </div>
      </div>
    </main>
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif">
      AI GAME STUDIO needs JavaScript. / هذه المنصة تحتاج إلى تفعيل JavaScript.
    </div>
  </noscript>

  <script>
    // Shown only if the app module fails to start, so a blank screen never happens.
    window.__aigsBooted = false;
    window.addEventListener('error', function (e) {
      if (window.__aigsBooted) return;
      var view = document.getElementById('view');
      if (!view) return;
      view.innerHTML =
        '<div class="boot boot-error"><p>AI GAME STUDIO</p>' +
        '<small>تعذّر تشغيل الواجهة. أعد تحميل الصفحة أو اضغط Run مرة أخرى.<br>' +
        'The interface could not start. Reload the page or press Run again.</small>' +
        '<pre></pre></div>';
      var pre = view.querySelector('pre');
      if (pre) pre.textContent = String((e && e.message) || e);
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
